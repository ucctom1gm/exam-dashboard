<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>期末考看板系統 v2.6</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <!-- Babel -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <style>
        input[type=number]::-webkit-inner-spin-button, 
        input[type=number]::-webkit-outer-spin-button { 
            -webkit-appearance: none; 
            margin: 0; 
        }
        
        body {
            font-family: "Microsoft JhengHei", "Heiti TC", sans-serif;
            overflow: hidden;
            background-color: #f3f4f6;
        }

        .btn-active:active {
            transform: scale(0.95);
        }

        .track-transition {
            transition: stroke-dashoffset 1s linear, stroke 0.5s ease;
        }

        .bg-stripes {
            background-image: linear-gradient(45deg, #fbbf24 25%, transparent 25%, transparent 50%, #fbbf24 50%, #fbbf24 75%, transparent 75%, transparent);
            background-size: 20px 20px;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fade-in {
            animation: fadeIn 0.5s ease-out forwards;
        }

        .time-input {
            background: transparent;
            border-bottom: 2px solid transparent;
            transition: all 0.2s;
            text-align: center;
        }
        .time-input:hover, .time-input:focus {
            border-bottom-color: #3b82f6;
            background: rgba(59, 130, 246, 0.05);
            outline: none;
        }

        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo, useRef } = React;

        const DEFAULT_SCHEDULE = [
            { id: 's1', type: 'break', start: '08:40', end: '09:10', label: '早自習' },
            { id: 's2', type: 'break', start: '09:10', end: '09:30', label: '準備' },
            { id: 'e1', type: 'exam',  start: '09:30', end: '10:10', label: '第一節' },
            { id: 's3', type: 'break', start: '10:10', end: '10:30', label: '下課' },
            { id: 'e2', type: 'exam',  start: '10:30', end: '11:10', label: '第二節' },
            { id: 's4', type: 'break', start: '11:10', end: '11:30', label: '下課 (大)' },
            { id: 'e3', type: 'exam',  start: '11:30', end: '12:10', label: '第三節' },
            { id: 's5', type: 'break', start: '12:10', end: '12:40', label: '收卷與午餐' }
        ];

        const EXAM_MESSAGES = [
            "考卷記得寫班級、姓名、座號",
            "有問題請舉手，不要擅自離開座位",
            "不會寫的題目先跳過，保持冷靜",
            "注意時間，細心檢查答案卡",
            "不要東張西望，保持教室安靜",
            "寫完請多檢查，確認是否有遺漏",
            "檢查完畢後可安靜趴下休息",
            "禁止交談，維持考試公平性"
        ];

        const BREAK_MESSAGES = [
            "利用下課時間上廁所、喝水",
            "準備下一個科目的文具與墊板",
            "桌面維持淨空，僅留必需用品",
            "調整心情，迎接下一場測試"
        ];

        const formatTime = (date) => {
            const h = String(date.getHours()).padStart(2, '0');
            const m = String(date.getMinutes()).padStart(2, '0');
            const s = String(date.getSeconds()).padStart(2, '0');
            return `${h}:${m}:${s}`;
        };

        const formatCountdown = (ms) => {
            if (ms < 0) return "00:00";
            const totalSec = Math.floor(ms / 1000);
            const m = String(Math.floor(totalSec / 60)).padStart(2, '0');
            const s = String(totalSec % 60).padStart(2, '0');
            return `${m}:${s}`;
        };

        const App = () => {
            const [now, setNow] = useState(new Date());
            const [offset, setOffset] = useState(() => {
                const saved = localStorage.getItem('exam_clock_offset');
                return saved ? parseInt(saved, 10) : 0;
            });

            const [systemAudio, setSystemAudio] = useState({
                warning5m: { src: null, fileName: "" },
                examEnd: { src: null, fileName: "" }
            });

            const [audioTracks, setAudioTracks] = useState([
                { src: null, fileName: "", isPlaying: false, progress: 0 },
                { src: null, fileName: "", isPlaying: false, progress: 0 },
                { src: null, fileName: "", isPlaying: false, progress: 0 }
            ]);
            
            const [isNoticeFocused, setIsNoticeFocused] = useState(false);
            
            const audioRefs = useRef([]);
            const sysWarningRef = useRef(null);
            const sysEndRef = useRef(null);
            const fileInputRefs = useRef([]);
            const lastTriggeredRef = useRef("");

            const [examData, setExamData] = useState(() => {
                const saved = localStorage.getItem('exam_data_v26');
                if (saved) return JSON.parse(saved);
                return {
                    subjects: ["國語文", "數學", "英語文"],
                    shouldArrive: "",
                    actualArrive: "",
                    absentList: "",
                    customNotice: "",
                    schedule: DEFAULT_SCHEDULE
                };
            });

            useEffect(() => {
                const timer = setInterval(() => setNow(new Date()), 1000);
                return () => clearInterval(timer);
            }, []);

            useEffect(() => {
                localStorage.setItem('exam_clock_offset', offset);
            }, [offset]);

            useEffect(() => {
                localStorage.setItem('exam_data_v26', JSON.stringify(examData));
            }, [examData]);

            const adjustedNow = useMemo(() => new Date(now.getTime() + offset), [now, offset]);

            const currentSlot = useMemo(() => {
                const currentMs = adjustedNow.getHours() * 3600000 + adjustedNow.getMinutes() * 60000 + adjustedNow.getSeconds() * 1000;
                for (let slot of examData.schedule) {
                    const [sh, sm] = slot.start.split(':').map(Number);
                    const startMs = sh * 3600000 + sm * 60000;
                    const [eh, em] = slot.end.split(':').map(Number);
                    const endMs = eh * 3600000 + em * 60000;
                    if (currentMs >= startMs && currentMs < endMs) {
                        return { ...slot, startMs, endMs, durationMs: endMs - startMs };
                    }
                }
                return null;
            }, [adjustedNow, examData.schedule]);

            useEffect(() => {
                if (!currentSlot || currentSlot.type !== 'exam') return;
                const currentMs = adjustedNow.getHours() * 3600000 + adjustedNow.getMinutes() * 60000 + adjustedNow.getSeconds() * 1000;
                const remainingSec = Math.floor((currentSlot.endMs - currentMs) / 1000);
                const triggerKey = `${currentSlot.start}-${remainingSec}`;
                if (lastTriggeredRef.current === triggerKey) return;

                if (remainingSec === 300 && systemAudio.warning5m.src) {
                    sysWarningRef.current.play().catch(e => {});
                    lastTriggeredRef.current = triggerKey;
                }
                if (remainingSec === 0 && systemAudio.examEnd.src) {
                    sysEndRef.current.play().catch(e => {});
                    lastTriggeredRef.current = triggerKey;
                }
            }, [adjustedNow, currentSlot, systemAudio]);

            const reminderMessage = useMemo(() => {
                if (!currentSlot) return "準備中...";
                const currentMs = adjustedNow.getHours() * 3600000 + adjustedNow.getMinutes() * 60000 + adjustedNow.getSeconds() * 1000;
                const elapsedMinutes = Math.floor((currentMs - currentSlot.startMs) / 60000);
                const messages = currentSlot.type === 'exam' ? EXAM_MESSAGES : BREAK_MESSAGES;
                const interval = currentSlot.type === 'exam' ? 5 : 2;
                const index = Math.floor(elapsedMinutes / interval) % messages.length;
                return messages[index];
            }, [adjustedNow, currentSlot]);

            const progressInfo = useMemo(() => {
                if (!currentSlot) return { remainingPercent: 0, color: 'stroke-gray-300', text: '等待中', countdown: "00:00" };
                const currentMs = adjustedNow.getHours() * 3600000 + adjustedNow.getMinutes() * 60000 + adjustedNow.getSeconds() * 1000;
                const progressMs = currentMs - currentSlot.startMs;
                const totalMs = currentSlot.durationMs;
                const remainingMs = totalMs - progressMs;
                const remainingPercent = 100 - (Math.min(100, Math.max(0, (progressMs / totalMs) * 100)));

                let colorClass = 'stroke-green-500';
                let statusText = currentSlot.type === 'exam' ? "考試時間" : "休息時間";

                if (currentSlot.type === 'exam') {
                    const examIndex = examData.schedule.filter(s => s.type === 'exam').findIndex(s => s.id === currentSlot.id);
                    const subjectName = examIndex >= 0 ? (examData.subjects[examIndex] || `科目 ${examIndex + 1}`) : "";
                    statusText = subjectName ? `${subjectName} 考試中` : "考試時間";

                    if (remainingMs <= 5 * 60000) { colorClass = 'stroke-red-500'; statusText = subjectName ? `${subjectName} - 最後 5 分鐘` : "最後 5 分鐘"; }
                    else if (remainingMs <= totalMs / 2) { colorClass = 'stroke-yellow-400'; statusText = subjectName ? `${subjectName} - 時間過半` : "時間過半"; }
                } else if (remainingMs <= 3 * 60000) {
                    colorClass = 'stroke-red-500'; statusText = "準備上課";
                }

                return { remainingPercent, color: colorClass, text: statusText, countdown: formatCountdown(remainingMs) };
            }, [adjustedNow, currentSlot, examData.schedule, examData.subjects]);

            const handleInputChange = (field, value) => setExamData(prev => ({ ...prev, [field]: value }));
            
            const handleScheduleChange = (id, field, value) => {
                const newSchedule = examData.schedule.map(s => s.id === id ? { ...s, [field]: value } : s);
                setExamData(prev => ({ ...prev, schedule: newSchedule }));
            };

            const handleSubjectChange = (index, value) => {
                const newSubjects = [...examData.subjects];
                newSubjects[index] = value;
                setExamData(prev => ({ ...prev, subjects: newSubjects }));
            };

            const resetAttendance = () => setExamData(prev => ({ ...prev, shouldArrive: "", actualArrive: "", absentList: "" }));
            const adjustTime = (seconds) => setOffset(prev => prev + (seconds * 1000));

            const handleFileSelect = (index, e) => {
                const file = e.target.files[0];
                if (file) {
                    const url = URL.createObjectURL(file);
                    setAudioTracks(prev => {
                        const newTracks = [...prev];
                        newTracks[index] = { src: url, fileName: file.name, isPlaying: false, progress: 0 };
                        return newTracks;
                    });
                }
            };

            const togglePlay = (index) => {
                const audioEl = audioRefs.current[index];
                setAudioTracks(prev => {
                    const newTracks = [...prev];
                    const isNowPlaying = !newTracks[index].isPlaying;
                    if (isNowPlaying) audioEl.play(); else audioEl.pause();
                    newTracks[index].isPlaying = isNowPlaying;
                    return newTracks;
                });
            };

            const handleSystemFileSelect = (type, e) => {
                const file = e.target.files[0];
                if (file) {
                    const url = URL.createObjectURL(file);
                    setSystemAudio(prev => ({
                        ...prev,
                        [type]: { src: url, fileName: file.name }
                    }));
                }
            };

            const isUsingCustomNotice = examData.customNotice && examData.customNotice.trim() !== "";
            const showAutoMessage = !isUsingCustomNotice && !isNoticeFocused;

            return (
                <div className="flex flex-col h-screen w-screen overflow-hidden text-gray-800 bg-gray-100">
                    
                    {/* === 上方：時間與進度 === */}
                    <div className="h-[30vh] min-h-[160px] w-full bg-white border-b-4 border-gray-300 flex flex-row shadow-lg z-10">
                        <div className="w-1/3 flex flex-col items-center justify-center border-r border-gray-200 bg-gray-50 group">
                            <div className="text-[2vh] text-gray-400 font-bold tracking-widest uppercase">Now</div>
                            <div className="text-[12vh] font-black leading-none text-gray-800 tabular-nums tracking-tighter">
                                {formatTime(adjustedNow)}
                            </div>
                            <div className="flex gap-2 mt-1 opacity-0 group-hover:opacity-100 transition-opacity">
                                <button onClick={() => adjustTime(60)} className="bg-gray-200 px-2 rounded text-xs py-1 hover:bg-gray-300">+1分</button>
                                <button onClick={() => adjustTime(-60)} className="bg-gray-200 px-2 rounded text-xs py-1 hover:bg-gray-300">-1分</button>
                            </div>
                        </div>

                        <div className="w-2/3 flex flex-col relative items-center justify-center overflow-hidden">
                            <div className="absolute inset-0 flex flex-col items-center justify-center z-10 pointer-events-none">
                                <span className="text-[2.5vh] font-bold text-gray-400 tracking-widest">{progressInfo.text}</span>
                                <span className="text-[14vh] font-black text-gray-800 leading-none tabular-nums">
                                    {progressInfo.countdown}
                                </span>
                            </div>
                            <svg className="w-full h-full p-6" viewBox="0 0 400 100" preserveAspectRatio="xMidYMid meet">
                                <rect x="10" y="10" width="380" height="80" rx="40" ry="40" fill="none" stroke="#f0f0f0" strokeWidth="8" />
                                <rect 
                                    x="10" y="10" width="380" height="80" rx="40" ry="40" fill="none" 
                                    className={`track-transition ${progressInfo.color}`} 
                                    strokeWidth="8" pathLength="100" strokeDasharray="100" 
                                    strokeDashoffset={100 - progressInfo.remainingPercent} strokeLinecap="round" 
                                />
                            </svg>
                        </div>
                    </div>

                    {/* === 下方區塊 === */}
                    <div className="flex-1 flex flex-row overflow-hidden">
                        
                        {/* 左：科目與出席 (A區) */}
                        <div className="w-1/2 flex flex-col border-r-4 border-gray-300 bg-white">
                            <div className="flex-1 flex flex-col overflow-y-auto no-scrollbar">
                                {examData.schedule.filter(s => s.type === 'exam').map((slot, index) => {
                                    const isActive = currentSlot && currentSlot.id === slot.id;
                                    return (
                                        <div key={slot.id} className={`flex-1 min-h-[90px] flex items-center gap-2 px-6 border-b border-gray-100 transition-colors ${isActive ? 'bg-yellow-100' : ''}`}>
                                            <input 
                                                type="text" 
                                                value={examData.subjects[index]} 
                                                onChange={(e) => handleSubjectChange(index, e.target.value)}
                                                className="flex-1 min-w-0 text-[3.2vw] font-black bg-transparent outline-none truncate"
                                                placeholder={`科目 ${index + 1}`}
                                            />
                                            
                                            <div className="flex-shrink-0 flex items-center gap-1 font-mono text-[2.2vw] font-bold text-gray-500 bg-gray-50 rounded-lg px-2 py-1 border border-gray-100">
                                                <input 
                                                    type="text" 
                                                    value={slot.start}
                                                    onChange={(e) => handleScheduleChange(slot.id, 'start', e.target.value)}
                                                    className="w-[5.8vw] time-input"
                                                />
                                                <span className="text-gray-300">/</span>
                                                <input 
                                                    type="text" 
                                                    value={slot.end}
                                                    onChange={(e) => handleScheduleChange(slot.id, 'end', e.target.value)}
                                                    className="w-[5.8vw] time-input"
                                                />
                                            </div>

                                            <div className="flex-shrink-0 flex gap-1 ml-2">
                                                <input type="file" accept="audio/*" ref={el => fileInputRefs.current[index] = el} onChange={(e) => handleFileSelect(index, e)} className="hidden" />
                                                <button onClick={() => fileInputRefs.current[index].click()} className="p-2 bg-gray-100 rounded-lg hover:bg-gray-200 border border-gray-200 shadow-sm">
                                                    <svg width="22" height="22" fill="gray" viewBox="0 0 16 16"><path d="M.5 9.9a.5.5 0 0 1 .5.5v2.5a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-2.5a.5.5 0 0 1 1 0v2.5a2 2 0 0 1-2 2H2a2 2 0 0 1-2-2v-2.5a.5.5 0 0 1 .5-.5z"/><path d="M7.646 1.146a.5.5 0 0 1 .708 0l3 3a.5.5 0 0 1-.708.708L8.5 2.707V11.5a.5.5 0 0 1-1 0V2.707L5.354 4.854a.5.5 0 1 1-.708-.708l3-3z"/></svg>
                                                </button>
                                                {audioTracks[index].src && (
                                                    <button onClick={() => togglePlay(index)} className={`px-4 py-1 rounded-lg text-white font-black text-base shadow-md ${audioTracks[index].isPlaying ? 'bg-red-500' : 'bg-green-500'}`}>
                                                        {audioTracks[index].isPlaying ? '止' : '聽'}
                                                    </button>
                                                )}
                                                <audio ref={el => audioRefs.current[index] = el} src={audioTracks[index].src || undefined} onEnded={() => setAudioTracks(prev => {const n=[...prev]; n[index].isPlaying=false; return n;})} />
                                            </div>
                                        </div>
                                    );
                                })}
                            </div>

                            {/* 下方人數區塊：加大字體 v2.6 */}
                            <div className="h-[25vh] min-h-[140px] grid grid-cols-4 bg-blue-50 border-t-2 border-gray-200">
                                <div className="flex flex-col items-center justify-center border-r border-blue-100">
                                    <span className="text-[2.8vh] font-black text-blue-600">應到</span>
                                    <input type="number" value={examData.shouldArrive} onChange={e=>handleInputChange('shouldArrive', e.target.value)} className="w-full text-center bg-transparent text-[8vh] font-black outline-none leading-none" placeholder="0" />
                                </div>
                                <div className="flex flex-col items-center justify-center border-r border-blue-100">
                                    <span className="text-[2.8vh] font-black text-green-600">實到</span>
                                    <input type="number" value={examData.actualArrive} onChange={e=>handleInputChange('actualArrive', e.target.value)} className="w-full text-center bg-transparent text-[8vh] font-black outline-none leading-none" placeholder="0" />
                                </div>
                                <div className="flex flex-col items-center justify-center border-r border-blue-100 px-2 overflow-hidden">
                                    <span className="text-[2.8vh] font-black text-red-600">缺席名單</span>
                                    <textarea value={examData.absentList} onChange={e=>handleInputChange('absentList', e.target.value)} className="w-full h-full bg-transparent text-center text-[3.5vh] font-black outline-none resize-none py-1 no-scrollbar leading-tight text-red-500" placeholder="..." />
                                </div>
                                <div className="p-4">
                                    <button onClick={resetAttendance} className="btn-active w-full h-full bg-blue-600 text-white rounded-2xl font-black text-[4vh] shadow-xl hover:bg-blue-700 transition-colors">重置</button>
                                </div>
                            </div>
                        </div>

                        {/* 右：提醒事項 (B區) */}
                        <div className="w-1/2 flex flex-col bg-yellow-50 relative overflow-hidden">
                            <div className="absolute top-0 left-0 bg-yellow-400 px-6 py-2 rounded-br-3xl font-black text-yellow-900 text-xl shadow-md z-30 pointer-events-none">
                                提醒事項 {examData.customNotice ? "(編輯中)" : "(輪播)"}
                            </div>
                            
                            <div className="flex-1 relative flex items-center justify-center p-12 overflow-hidden">
                                <textarea 
                                    value={examData.customNotice}
                                    onFocus={() => setIsNoticeFocused(true)}
                                    onBlur={() => setIsNoticeFocused(false)}
                                    onChange={(e) => handleInputChange('customNotice', e.target.value)}
                                    className={`absolute inset-0 w-full h-full p-16 bg-transparent font-black text-gray-700 text-center outline-none resize-none z-20 transition-all no-scrollbar flex items-center justify-center
                                        ${ (examData.customNotice || isNoticeFocused) ? 'opacity-100' : 'opacity-0'}
                                        text-[7vh] leading-tight`}
                                    placeholder="在此輸入提醒..."
                                />
                                
                                {showAutoMessage && (
                                    <div className="w-full flex items-center justify-center pointer-events-none z-10">
                                         <div className="text-[7vh] font-black text-center text-gray-600 animate-fade-in leading-tight drop-shadow-sm">
                                            {reminderMessage}
                                        </div>
                                    </div>
                                )}
                            </div>

                            <div className="h-[25vh] min-h-[140px] bg-gray-800 text-white p-4 flex flex-col gap-2">
                                <div className="text-[10px] text-gray-500 tracking-widest font-bold uppercase">System Audio Settings</div>
                                <div className="grid grid-cols-2 gap-4 flex-1">
                                    <div className="bg-gray-700 rounded-xl p-3 flex flex-col justify-between border border-gray-600 shadow-inner">
                                        <div className="flex justify-between items-center">
                                            <span className="text-xs text-yellow-400 font-bold">倒數 5 分鐘</span>
                                            <input type="file" id="sys5m" className="hidden" onChange={e => handleSystemFileSelect('warning5m', e)} />
                                            <label htmlFor="sys5m" className="cursor-pointer bg-gray-600 px-3 py-1 rounded-md text-[10px] hover:bg-gray-500 border border-gray-500 transition-colors">上傳檔案</label>
                                        </div>
                                        <div className="text-[10px] text-gray-400 truncate mt-2 bg-black/20 p-1 rounded italic">
                                            {systemAudio.warning5m.fileName || "未選擇檔案"}
                                        </div>
                                        <audio ref={sysWarningRef} src={systemAudio.warning5m.src || undefined} />
                                    </div>
                                    <div className="bg-gray-700 rounded-xl p-3 flex flex-col justify-between border border-gray-600 shadow-inner">
                                        <div className="flex justify-between items-center">
                                            <span className="text-xs text-red-400 font-bold">收卷鈴聲</span>
                                            <input type="file" id="sysEnd" className="hidden" onChange={e => handleSystemFileSelect('examEnd', e)} />
                                            <label htmlFor="sysEnd" className="cursor-pointer bg-gray-600 px-3 py-1 rounded-md text-[10px] hover:bg-gray-500 border border-gray-500 transition-colors">上傳檔案</label>
                                        </div>
                                        <div className="text-[10px] text-gray-400 truncate mt-2 bg-black/20 p-1 rounded italic">
                                            {systemAudio.examEnd.fileName || "未選擇檔案"}
                                        </div>
                                        <audio ref={sysEndRef} src={systemAudio.examEnd.src || undefined} />
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
